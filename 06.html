<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陀螺儀紅箭咀方向指示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #arrow {
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 120px solid #ff0000;
            position: absolute;
            transform-origin: 50% 65%;
            will-change: transform;
        }
        #permission-btn {
            position: absolute;
            padding: 15px 30px;
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <div id="container">
        <button id="permission-btn">啟用陀螺儀</button>
        <div id="arrow"></div>
    </div>

    <script>
        const arrow = document.getElementById('arrow');
        const btn = document.getElementById('permission-btn');

        function handleOrientation(event) {
            // gamma: 左右傾斜 (-90 到 90)
            // beta: 前後傾斜 (-180 到 180)
            // alpha: 方位角 (0 到 360)
            let gamma = event.gamma || 0;
            let beta = event.beta || 0;
            let alpha = event.alpha || 0;

            // 為了讓箭咀在畫面直立或平放時都能自然指向，這裡綜合 alpha 與 gamma 計算旋轉角度
            // 當手機平放時，主要由 alpha 控制方向；當手機直立時，主要結合 gamma 和 alpha
            let rotation = alpha - gamma;
            
            arrow.style.transform = `rotate(${rotation}deg)`;
        }

        function initSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ 裝置需要權限請求
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            btn.style.display = 'none';
                        } else {
                            alert('需要授權才能使用陀螺儀');
                        }
                    })
                    .catch(console.error);
            } else {
                // Android 及其他支援的裝置
                window.addEventListener('deviceorientation', handleOrientation, true);
                btn.style.display = 'none';
            }
        }

        // 偵測是否需要手動點擊按鈕授權 (主要針對 iOS)
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            btn.style.display = 'block';
            btn.addEventListener('click', initSensor);
        } else {
            initSensor();
        }
    </script>
</body>
</html>
