<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陀螺儀紅箭咀方向指示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 固定不動的背景長方形 */
        #bg-rect {
            position: absolute;
            width: 300px;
            height: 180px;
            background-color: #222222;
            border: 2px solid #444444;
            border-radius: 12px;
            z-index: 1;
        }
        /* 會跟著旋轉的紅色箭咀 */
        #arrow {
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 120px solid #ff0000;
            position: absolute;
            transform-origin: 50% 65%;
            will-change: transform;
            z-index: 2;
        }
        #permission-btn {
            position: absolute;
            padding: 15px 30px;
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <div id="container">
        <button id="permission-btn">啟用陀螺儀</button>
        <div id="bg-rect"></div>
        <div id="arrow"></div>
    </div>

    <script>
        const arrow = document.getElementById('arrow');
        const btn = document.getElementById('permission-btn');

        function handleOrientation(event) {
            let alpha = event.alpha || 0;
            arrow.style.transform = `rotate(${alpha}deg)`;
        }

        function initSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            btn.style.display = 'none';
                        } else {
                            alert('需要授權才能使用陀螺儀');
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
                btn.style.display = 'none';
            }
        }

        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            btn.style.display = 'block';
            btn.addEventListener('click', initSensor);
        } else {
            initSensor();
        }
    </script>
</body>
</html>
