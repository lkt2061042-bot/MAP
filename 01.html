<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3000x3000mm 導航測試（預設靈敏度60、步幅5）</title>
    <style>
        body { margin: 0; padding: 10px; font-family: sans-serif; background: #121212; color: #fff; text-align: center; }
        .panel { background: #1e1e1e; padding: 10px; border-radius: 8px; margin: 10px auto; max-width: 400px; font-size: 14px; text-align: left; }
        button, input { padding: 8px; font-size: 14px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; margin-top: 5px; }
        button { background: #0055ff; cursor: pointer; font-weight: bold; width: 100%; }
        button.warning { background: #ff5500; }
        button.success { background: #00aa55; }
        button.test { background: #aa00ff; }
        canvas { background: #181818; display: block; margin: 0 auto; border-radius: 8px; border: 2px solid #333; max-width: 100%; width: 350px; height: 350px; }
        .row { display: flex; gap: 8px; }
        .flex-center { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; }
    </style>
</head>
<body>

    <h3>3000x3000mm 流暢導航測試</h3>
    
    <div class="panel">
        <button onclick="startAndroidSensor()">1. 點擊啟動感應器與計步</button>
        <p id="debugMsg" style="font-size: 11px; color: #ff5555; margin: 5px 0 0 0;">狀態: 等待啟動</p>
    </div>

    <canvas id="mapCanvas" width="350" height="350"></canvas>

    <div class="panel">
        <div><strong>步數參數設定 (1-100)</strong></div>
        <div class="flex-center">
            <span>靈敏度閥值 (預設60):</span>
            <input type="number" id="sensitivityInput" min="1" max="100" value="60" style="width: 70px; text-align: center;">
        </div>
        <div class="flex-center" style="margin-top: 5px;">
            <span>步幅大小 (預設5):</span>
            <input type="number" id="strideInput" min="1" max="100" value="5" style="width: 70px; text-align: center;">
        </div>

        <div style="margin-top: 8px;">
            <button class="test" onclick="simulateStep()">模擬跨一步 (+步數)</button>
        </div>
        <div class="row" style="margin-top: 8px;">
            <button class="warning" onclick="waitMarker()">等等我 (拉回標記)</button>
            <button class="success" onclick="syncPositionAtMarker()">我已到標記位</button>
        </div>
        <div style="margin-top: 10px;">
            <input type="text" id="deviceInput" placeholder="輸入牆上電掣 (如 SW-301)" style="width: 65%;">
            <button onclick="calibrateByDevice()" style="width: 30%; display:inline-block;">校準</button>
        </div>
        <p style="margin: 8px 0 0 0; color: #aaa; font-size: 12px; text-align: center;">
            朝向角度: <span id="heading" style="color: #00ffcc; font-weight: bold;">--</span>° | 步數: <span id="stepCount">0</span> 步
        </p>
    </div>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    const roomSize = 3000; 
    const canvasSize = 350;
    const padding = 25;
    const drawAreaSize = canvasSize - (padding * 2);

    function mmToPx(mmX, mmY) {
        let px = padding + (mmX / roomSize) * drawAreaSize;
        let py = padding + (mmY / roomSize) * drawAreaSize;
        return { x: px, y: py };
    }

    const devices = {
        'SW-301': { x: 1500, y: 0, name: '北牆 SW-301' },
        'SW-302': { x: 3000, y: 1500, name: '東牆 SW-302' },
        'SW-303': { x: 1500, y: 3000, name: '南牆 SW-303' },
        'SW-304': { x: 0, y: 1500, name: '西牆 SW-304' }
    };

    let userPos = { x: 1500, y: 2500 };   
    let markerPos = { x: 1500, y: 2500 };   
    let displayPos = { x: 1500, y: 2500 };  
    
    let userHeading = 0;              
    let displayHeading = 0;           
    let stepCount = 0;
    let isRunning = false;

    function drawRoom() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let topLeft = mmToPx(0, 0);
        let bottomRight = mmToPx(roomSize, roomSize);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 3;
        ctx.strokeRect(topLeft.x, topLeft.y, bottomRight.x - topLeft.x, bottomRight.y - topLeft.y);

        // 畫網格
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        for (let i = 1000; i < roomSize; i += 1000) {
            let p1 = mmToPx(i, 0); let p2 = mmToPx(i, roomSize);
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            let h1 = mmToPx(0, i); let h2 = mmToPx(roomSize, i);
            ctx.beginPath(); ctx.moveTo(h1.x, h1.y); ctx.lineTo(h2.x, h2.y); ctx.stroke();
        }

        // 畫電掣
        for (let key in devices) {
            let dev = devices[key];
            let p = mmToPx(dev.x, dev.y);
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#888'; ctx.font = '10px sans-serif';
            ctx.fillText(key, p.x + 6, p.y + 3);
        }

        // 真人位置 (藍點)
        let uPx = mmToPx(userPos.x, userPos.y);
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath(); ctx.arc(uPx.x, uPx.y, 6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

        // 虛擬標記/箭頭 (紅箭頭)
        let mPx = mmToPx(displayPos.x, displayPos.y);
        ctx.save();
        ctx.translate(mPx.x, mPx.y);
        ctx.rotate((-displayHeading * Math.PI) / 180); 
        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(-7, 8);
        ctx.lineTo(7, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function animationLoop() {
        displayPos.x += (markerPos.x - displayPos.x) * 0.2;
        displayPos.y += (markerPos.y - displayPos.y) * 0.2;

        let diff = userHeading - displayHeading;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        displayHeading += diff * 0.2;

        drawRoom();
        requestAnimationFrame(animationLoop);
    }

    function startAndroidSensor() {
        isRunning = true;
        document.getElementById('debugMsg').innerText = "狀態: 流暢導航運行中...";
        document.getElementById('debugMsg').style.color = "#00ffcc";

        if ('ondeviceorientationabsolute' in window) {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else {
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
        
        alert('已啟動流暢模式！');
    }

    function handleOrientation(event) {
        let heading = event.alpha;
        if (heading !== null) {
            userHeading = heading;
            document.getElementById('heading').innerText = Math.round(userHeading);
        }
    }

    function addStepForward() {
        stepCount++;
        document.getElementById('stepCount').innerText = stepCount;

        // 讀取步幅設定 (預設 5，基準值 780mm 進行等比縮放)
        let strideInput = parseInt(document.getElementById('strideInput').value) || 5;
        strideInput = Math.max(1, Math.min(100, strideInput));
        let currentStrideMM = (strideInput / 100) * 780;

        let rad = (-userHeading * Math.PI) / 180;
        markerPos.x += Math.sin(rad) * currentStrideMM;
        markerPos.y -= Math.cos(rad) * currentStrideMM; 

        markerPos.x = Math.max(0, Math.min(roomSize, markerPos.x));
        markerPos.y = Math.max(0, Math.min(roomSize, markerPos.y));
    }

    function simulateStep() {
        if (!isRunning) {
            alert('請先點擊上方按鈕啟動系統！');
            return;
        }
        addStepForward();
    }

    function waitMarker() {
        markerPos.x = userPos.x;
        markerPos.y = userPos.y;
    }

    function syncPositionAtMarker() {
        userPos.x = markerPos.x;
        userPos.y = markerPos.y;
    }

    function calibrateByDevice() {
        let code = document.getElementById('deviceInput').value.trim().toUpperCase();
        if (devices[code]) {
            userPos.x = devices[code].x;
            userPos.y = devices[code].y;
            markerPos.x = devices[code].x;
            markerPos.y = devices[code].y;
            displayPos.x = devices[code].x;
            displayPos.y = devices[code].y;
            alert(`成功校準至: ${devices[code].name}`);
            document.getElementById('deviceInput').value = '';
        } else {
            alert('無效的電掣編號！請輸入 SW-301 至 SW-304');
        }
    }

    let lastPeakTime = 0;
    window.addEventListener('devicemotion', (event) => {
        if (!isRunning) return;
        let acc = event.accelerationIncludingGravity;
        if (!acc) return;

        let totalAcc = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        let now = Date.now();

        let sensInput = parseInt(document.getElementById('sensitivityInput').value) || 60;
        sensInput = Math.max(1, Math.min(100, sensInput));
        let threshold = 13.5 - (sensInput / 100) * 3.5; 

        if (totalAcc > threshold && (now - lastPeakTime) > 300) {
            lastPeakTime = now;
            addStepForward();
        }
    }, true);

    animationLoop();
</script>

</body>
</html>
