<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>室內導航測試 · 4 房間 / 2 走廊</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 地圖畫布：紅箭頭固定在畫面中央，移動的是地圖 -->
<canvas id="mapCanvas"></canvas>

<!-- 頂部狀態列 -->
<div id="hud">
  <span class="chip">朝向 <b class="cyan" id="hudHeading">0</b>°</span>
  <span class="chip"><b id="hudSteps">0</b> 步</span>
  <span class="chip">剩餘 <b id="hudDist">--</b></span>
  <span class="chip" id="hudPhase" data-phase="idle">待機</span>
</div>

<!-- 方向校正提示條 -->
<div id="calibBar">
  <div class="calibLine">
    <span>導航方位 <b id="calibBearing">--</b>°</span>
    <span>箭頭 <b id="calibArrow">--</b>°</span>
    <span>偏差 <b id="calibDev">--</b>°</span>
  </div>
  <div class="hint" id="calibHint">請將手機朝向導航方向，然後按「確認開始導航」</div>
  <div class="row">
    <button id="calibrateBtn" class="primary">確認開始導航</button>
    <button id="skipCalibBtn">略過</button>
  </div>
</div>

<!-- 右下浮動按鈕 -->
<div id="fab">
  <button id="recenterBtn" title="重設視角">◎</button>
  <button id="panelToggle" title="開關控制面板">☰</button>
</div>

<div id="toast"></div>

<!-- 控制面板 -->
<div id="panel">
  <div class="tabs">
    <button class="tab active" data-tab="nav">導航</button>
    <button class="tab" data-tab="pos">定位</button>
    <button class="tab" data-tab="cfg">設定</button>
  </div>

  <!-- ============ 導航 ============ -->
  <section class="pane active" data-pane="nav">
    <div class="field">
      <label>起點</label>
      <select id="startSelect"></select>
      <div class="row2">
        <input type="number" id="startX" step="10" inputmode="numeric" placeholder="X (mm)">
        <input type="number" id="startY" step="10" inputmode="numeric" placeholder="Y (mm)">
      </div>
      <button class="mini" id="pickStartBtn">在地圖上點選起點</button>
    </div>

    <div class="field">
      <label>終點</label>
      <select id="destSelect"></select>
      <div class="row2">
        <input type="number" id="destX" step="10" inputmode="numeric" placeholder="X (mm)">
        <input type="number" id="destY" step="10" inputmode="numeric" placeholder="Y (mm)">
      </div>
      <button class="mini" id="pickDestBtn">在地圖上點選終點</button>
    </div>

    <div class="row">
      <button id="planBtn" class="primary">確定並開始導航</button>
      <button id="clearBtn">清除</button>
    </div>

    <p class="hint" id="planHint">
      選單可直接挑房間／電掣，或自行輸入 X / Y（單位 mm，地圖 8200 × 7000）。
      確定後紅箭頭會自動移到起點，並用有方向的導航線帶你走到終點。
    </p>
  </section>

  <!-- ============ 定位 ============ -->
  <section class="pane" data-pane="pos">
    <button id="sensorBtn" class="primary">1. 啟動感應器與計步</button>
    <p class="hint" id="sensorMsg">狀態：未啟動</p>

    <button id="stepBtn" class="test">模擬跨一步</button>

    <div class="row">
      <button id="markBtn" class="warn">等等我（標記＝目前）</button>
      <button id="syncBtn" class="ok">我已到標記位</button>
    </div>

    <div class="field" style="margin-top:14px;">
      <label>牆上電掣校準</label>
      <div class="row">
        <input type="text" id="deviceInput" placeholder="SW-301">
        <button id="deviceBtn" style="flex:0 0 72px;">校準</button>
      </div>
      <p class="hint">可用電掣：SW-301 ~ SW-305（見地圖上的橙點）</p>
    </div>
  </section>

  <!-- ============ 設定 ============ -->
  <section class="pane" data-pane="cfg">
    <div class="field">
      <label>靈敏度閾值 <b id="sensVal">60</b>（越大越易觸發）</label>
      <input type="range" id="sensitivityInput" min="1" max="100" value="60">
    </div>

    <div class="field">
      <label>步幅 <b id="strideVal">5</b>　每步約 <span id="strideMM">39</span> mm</label>
      <input type="range" id="strideInput" min="1" max="100" value="5">
    </div>

    <div class="field">
      <label>
        <input type="checkbox" id="simToggle"> 模擬朝向（沒有感應器時測試用）
      </label>
      <label style="margin-top:6px;">模擬方向 <b id="simVal">0</b>°</label>
      <input type="range" id="simHeading" min="0" max="359" value="0">
    </div>

    <div class="field">
      <label><input type="checkbox" id="gridToggle" checked> 顯示 1 m 網格</label>
    </div>

    <div class="field">
      <label>視角</label>
      <div class="btnGrid">
        <button id="zoomOut">－</button>
        <button id="zoomIn">＋</button>
        <button id="rotL">↺</button>
        <button id="rotR">↻</button>
        <button id="resetViewBtn">重設</button>
      </div>
      <p class="hint">單指拖曳＝旋轉地圖，雙指＝同時旋轉＋縮放，滾輪＝縮放。地圖中心一直鎖在紅箭頭上，所以箭頭永遠在畫面正中。</p>
    </div>

    <button id="resetBtn" class="warn">重置位置與導航</button>
  </section>
</div>

<!-- ============ 模組（傳統 script，file:// 也可直接開啟） ============ -->
<script src="js/config.js"></script>
<script src="js/geometry.js"></script>
<script src="js/layout.js"></script>
<script src="js/camera.js"></script>
<script src="js/nav.js"></script>
<script src="js/render.js"></script>
<script src="js/sensors.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
