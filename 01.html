<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>室內導航測試 · 4 房間 / 2 走廊</title>
<!-- 所有檔案都放在同一層，路徑一律用相對檔名 -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 地圖畫布：紅箭頭固定在畫面中央，移動的是地圖 -->
<canvas id="mapCanvas"></canvas>

<!-- 頂部狀態列 -->
<div id="hud">
  <span class="chip">朝向 <b class="cyan" id="hudHeading">0</b>°</span>
  <span class="chip"><b id="hudSteps">0</b> 步</span>
  <span class="chip">剩餘 <b id="hudDist">--</b></span>
  <span class="chip" id="hudPhase" data-phase="idle">待機</span>
</div>

<!-- 方向校正提示條 -->
<div id="calibBar">
  <div class="calibLine">
    <span>導航方位 <b id="calibBearing">--</b>°</span>
    <span>箭頭 <b id="calibArrow">--</b>°</span>
    <span>偏差 <b id="calibDev">--</b>°</span>
  </div>
  <div class="hint" id="calibHint">請將手機朝向導航方向，然後按「確認開始導航」</div>
  <div class="row">
    <button id="calibrateBtn" class="primary">確認開始導航</button>
    <button id="skipCalibBtn">略過</button>
  </div>
</div>

<!-- 右下浮動按鈕 -->
<div id="fab">
  <button id="recenterBtn" title="重設視角">◎</button>
  <button id="panelToggle" title="開關控制面板">☰</button>
</div>

<div id="toast"></div>

<!-- 控制面板 -->
<div id="panel">
  <div class="tabs">
    <button class="tab active" data-tab="nav">導航</button>
    <button class="tab" data-tab="pos">定位</button>
    <button class="tab" data-tab="cfg">設定</button>
  </div>

  <!-- ============ 導航 ============ -->
  <section class="pane active" data-pane="nav">
    <div class="field">
      <label>起點</label>
      <select id="startSelect"></select>
      <div class="row2">
        <input type="number" id="startX" step="10" inputmode="numeric" placeholder="X (mm)">
        <input type="number" id="startY" step="10" inputmode="numeric" placeholder="Y (mm)">
      </div>
      <button class="mini" id="pickStartBtn">在地圖上點選起點</button>
    </div>

    <div class="field">
      <label>終點</label>
      <select id="destSelect"></select>
      <div class="row2">
        <input type="number" id="destX" step="10" inputmode="numeric" placeholder="X (mm)">
        <input type="number" id="destY" step="10" inputmode="numeric" placeholder="Y (mm)">
      </div>
      <button class="mini" id="pickDestBtn">在地圖上點選終點</button>
    </div>

    <div class="row">
      <button id="planBtn" class="primary">確定並開始導航</button>
      <button id="clearBtn">清除</button>
    </div>

    <p class="hint" id="planHint">
      選單可直接挑房間／電掣，或自行輸入 X / Y（單位 mm，地圖 8200 × 7000）。
      確定後紅箭頭會自動移到起點，並用有方向的導航線帶你走到終點。
    </p>
  </section>

  <!-- ============ 定位 ============ -->
  <section class="pane" data-pane="pos">
    <button id="sensorBtn" class="primary">1. 啟動感應器與計步</button>
    <p class="hint" id="sensorMsg">狀態：未啟動</p>

    <button id="stepBtn" class="test">模擬跨一步</button>

    <div class="row">
      <button id="markBtn" class="warn">等等我（標記＝目前）</button>
      <button id="syncBtn" class="ok">我已到標記位</button>
    </div>

    <div class="field" style="margin-top:14px;">
      <label>牆上電掣校準</label>
      <div class="row">
        <input type="text" id="deviceInput" placeholder="SW-301">
        <button id="deviceBtn" style="flex:0 0 72px;">校準</button>
      </div>
      <p class="hint">可用電掣：SW-301 ~ SW-305（見地圖上的橙點）</p>
    </div>
  </section>

  <!-- ============ 設定 ============ -->
  <section class="pane" data-pane="cfg">
    <div class="field">
      <label>靈敏度閾值 <b id="sensVal">60</b>（越大越易觸發）</label>
      <input type="range" id="sensitivityInput" min="1" max="100" value="60">
    </div>

    <div class="field">
      <label>步幅 <b id="strideVal">5</b>　每步約 <span id="strideMM">39</span> mm</label>
      <input type="range" id="strideInput" min="1" max="100" value="5">
    </div>

    <div class="field">
      <label>
        <input type="checkbox" id="simToggle"> 模擬朝向（沒有感應器時測試用）
      </label>
      <label style="margin-top:6px;">模擬方向 <b id="simVal">0</b>°</label>
      <input type="range" id="simHeading" min="0" max="359" value="0">
    </div>

    <div class="field">
      <label><input type="checkbox" id="gridToggle" checked> 顯示 1 m 網格</label>
    </div>

    <div class="field">
      <label>視角</label>
      <div class="btnGrid">
        <button id="zoomOut">－</button>
        <button id="zoomIn">＋</button>
        <button id="rotL">↺</button>
        <button id="rotR">↻</button>
        <button id="resetViewBtn">重設</button>
      </div>
      <p class="hint">單指拖曳＝旋轉地圖，雙指＝同時旋轉＋縮放，滾輪＝縮放。地圖中心一直鎖在紅箭頭上，所以箭頭永遠在畫面正中。</p>
    </div>

    <button id="resetBtn" class="warn">重置位置與導航</button>
  </section>
</div>

<!-- ============ 模組（傳統 script，file:// 也可直接開啟） ============ -->
<!-- 這 9 個 .js 必須和這份 HTML 放在同一層，檔名不要改 -->
<script src="config.js"></script>
<script src="geometry.js"></script>
<script src="layout.js"></script>
<script src="camera.js"></script>
<script src="nav.js"></script>
<script src="render.js"></script>
<script src="sensors.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>

<!-- ============ 載入自檢：資源 404 時直接講明缺哪個，不要只給白畫面 ============ -->
<script>
(function () {
  var need = ['config', 'geometry', 'layout', 'camera', 'nav', 'render', 'sensors', 'ui', 'app'];
  var missing = [];
  for (var i = 0; i < need.length; i++) {
    if (!window.APP || !window.APP[need[i]]) missing.push(need[i] + '.js');
  }

  var cssOk = false;
  try {
    var bg = getComputedStyle(document.body).backgroundColor;
    cssOk = !!bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent';
  } catch (e) { cssOk = true; }

  if (missing.length === 0 && cssOk) return;
  if (!cssOk) missing.unshift('style.css');

  var dir = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0b0e13;color:#e6edf3;' +
    'font:14px/1.75 -apple-system,"Microsoft JhengHei",sans-serif;padding:24px;overflow:auto;';
  box.innerHTML =
    '<h3 style="color:#ff6b81;margin:0 0 14px;font-size:17px;">資源載入失敗（HTTP 404）</h3>' +
    '<p style="margin:0 0 6px;color:#8b98a8;font-size:13px;">以下檔案找不到：</p>' +
    '<p style="margin:0 0 18px;color:#ffaa00;font-weight:700;word-break:break-all;">' +
    missing.join('、') + '</p>' +
    '<p style="margin:0 0 6px;font-size:13px;">請檢查：</p>' +
    '<ol style="margin:0 0 18px;padding-left:20px;color:#c3ced9;font-size:13px;">' +
    '<li>所有檔案要放在<b>同一層</b>（不要放進 js/ 或 css/ 子資料夾）</li>' +
    '<li>檔名要完全一樣（全小寫：<code>config.js</code>、<code>geometry.js</code> …）</li>' +
    '<li>這份 HTML 也要放在同一層</li>' +
    '</ol>' +
    '<p style="margin:0;color:#8b98a8;font-size:12px;word-break:break-all;">目前所在目錄：<br>' +
    '<span style="color:#e6edf3;">' + dir + '</span></p>';
  document.body.appendChild(box);
})();
</script>

</body>
</html>
