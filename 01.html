<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3000x3000mm 導航測試（Camera 置中與旋轉版）</title>
    <style>
        body { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: #121212; color: #fff; text-align: center; 
            overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: space-between;
        }
        .top-panel { background: #1e1e1e; padding: 8px; font-size: 14px; z-index: 10; border-bottom: 1px solid #333; }
        .bottom-panel { background: #1e1e1e; padding: 10px; font-size: 13px; text-align: left; z-index: 10; max-height: 40vh; overflow-y: auto; border-top: 1px solid #333; }
        button, input { padding: 8px; font-size: 14px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; margin-top: 4px; }
        button { background: #0055ff; cursor: pointer; font-weight: bold; width: 100%; }
        button.warning { background: #ff5500; }
        button.success { background: #00aa55; }
        button.test { background: #aa00ff; }
        
        /* 畫布佔滿中間可用空間，讓紅箭頭永遠在正中央 */
        .canvas-container { flex: 1; position: relative; overflow: hidden; background: #181818; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .row { display: flex; gap: 8px; }
        .flex-center { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="top-panel">
        <button onclick="startAndroidSensor()">1. 點擊啟動感應器與計步</button>
        <p id="debugMsg" style="font-size: 11px; color: #ff5555; margin: 4px 0 0 0;">狀態: 等待啟動</p>
    </div>

    <!-- 地圖畫布容器 -->
    <div class="canvas-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <div class="bottom-panel">
        <div><strong>步數參數設定 (1-100)</strong></div>
        <div class="flex-center">
            <span>靈敏度閥值 (預設60):</span>
            <input type="number" id="sensitivityInput" min="1" max="100" value="60" style="width: 60px; text-align: center;">
        </div>
        <div class="flex-center">
            <span>步幅大小 (預設5):</span>
            <input type="number" id="strideInput" min="1" max="100" value="5" style="width: 60px; text-align: center;">
        </div>

        <div style="margin-top: 4px;">
            <button class="test" onclick="simulateStep()">模擬跨一步 (+步數)</button>
        </div>
        <div class="row" style="margin-top: 4px;">
            <button class="warning" onclick="waitMarker()">等等我 (拉回標記)</button>
            <button class="success" onclick="syncPositionAtMarker()">我已到標記位</button>
        </div>
        <div style="margin-top: 4px;" class="row">
            <input type="text" id="deviceInput" placeholder="牆上電掣 (如 SW-301)" style="flex: 1;">
            <button onclick="calibrateByDevice()" style="flex: 0 0 70px; margin-top:4px;">校準</button>
        </div>
        <p style="margin: 4px 0 0 0; color: #aaa; font-size: 11px; text-align: center;">
            朝向角度: <span id="heading" style="color: #00ffcc; font-weight: bold;">--</span>° | 步數: <span id="stepCount">0</span> 步
        </p>
    </div>

<script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    const roomSize = 3000; // 3000 x 3000 mm

    const devices = {
        'SW-301': { x: 1500, y: 0, name: '北牆 SW-301' },
        'SW-302': { x: 3000, y: 1500, name: '東牆 SW-302' },
        'SW-303': { x: 1500, y: 3000, name: '南牆 SW-303' },
        'SW-304': { x: 0, y: 1500, name: '西牆 SW-304' }
    };

    let userPos = { x: 1500, y: 2500 };   
    let markerPos = { x: 1500, y: 2500 };   
    let displayPos = { x: 1500, y: 2500 };  // 用於平滑內插的顯示座標
    
    let userHeading = 0;              
    let displayHeading = 0;           
    let stepCount = 0;
    let isRunning = false;

    // Camera 攝影機系統：負責以 displayPos 為中心，將地圖平滑跟隨並反向旋轉
    const cam = {
        x: 1500,
        y: 2500,
        scale: 0.15, // 放大倍率 (px per mm)
        follow(target) {
            this.x += (target.x - this.x) * 0.15;
            this.y += (target.y - this.y) * 0.15;
        },
        applyTransform(ctx, vw, vh) {
            // 將畫布原點移至畫面正中央
            ctx.translate(vw / 2, vh / 2);
            // 讓地圖跟隨手機轉向反向旋轉，使紅箭頭永遠朝上且固定在中心
            ctx.rotate((-displayHeading * Math.PI) / 180);
            // 縮放
            ctx.scale(this.scale, this.scale);
            // 將鏡頭位置移至對應的 mm 座標
            ctx.translate(-this.x, -this.y);
        }
    };

    function resizeCanvas() {
        const container = canvas.parentElement;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = container.clientWidth * dpr;
        canvas.height = container.clientHeight * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawRoom() {
        const vw = canvas.width / window.devicePixelRatio;
        const vh = canvas.height / window.devicePixelRatio;
        ctx.clearRect(0, 0, vw, vh);

        ctx.save();
        // 套用 Camera 變換：地圖在腳下移動與旋轉
        cam.applyTransform(ctx, vw, vh);

        // 1. 繪製房間外框 (3000x3000mm)
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 15;
        ctx.strokeRect(0, 0, roomSize, roomSize);

        // 2. 畫網格 (每 1000mm 一格)
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 8;
        for (let i = 1000; i < roomSize; i += 1000) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, roomSize); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(roomSize, i); ctx.stroke();
        }

        // 3. 畫電掣
        for (let key in devices) {
            let dev = devices[key];
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath(); ctx.arc(dev.x, dev.y, 40, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#aaa'; ctx.font = '70px sans-serif';
            ctx.fillText(key, dev.x + 60, dev.y + 25);
        }

        ctx.restore();

        // 4. 紅箭頭：透過 Camera 變換後，永遠精準固定在畫面正中央！
        const centerX = vw / 2;
        const centerY = vh / 2;

        ctx.save();
        ctx.translate(centerX, centerY);
        // 因為地圖已經反向旋轉，這裡的紅箭頭保持朝上 (0度) 即可完美與世界對齊
        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(-12, 14);
        ctx.lineTo(12, 14);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
    }

    function animationLoop() {
        // 平滑更新位置與角度
        displayPos.x += (markerPos.x - displayPos.x) * 0.2;
        displayPos.y += (markerPos.y - displayPos.y) * 0.2;

        let diff = userHeading - displayHeading;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        displayHeading += diff * 0.2;

        // 攝影機鎖定並平滑跟隨目前顯示座標
        cam.follow(displayPos);

        drawRoom();
        requestAnimationFrame(animationLoop);
    }

    function startAndroidSensor() {
        isRunning = true;
        document.getElementById('debugMsg').innerText = "狀態: Camera 置中導航運行中...";
        document.getElementById('debugMsg').style.color = "#00ffcc";

        if ('ondeviceorientationabsolute' in window) {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else {
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
        
        alert('已啟動感應器！');
    }

    function handleOrientation(event) {
        let heading = event.alpha;
        if (heading !== null) {
            userHeading = heading;
            document.getElementById('heading').innerText = Math.round(userHeading);
        }
    }

    function addStepForward() {
        stepCount++;
        document.getElementById('stepCount').innerText = stepCount;

        let strideInput = parseInt(document.getElementById('strideInput').value) || 5;
        strideInput = Math.max(1, Math.min(100, strideInput));
        let currentStrideMM = (strideInput / 100) * 780;

        let rad = (userHeading * Math.PI) / 180;
        markerPos.x += Math.sin(rad) * currentStrideMM;
        markerPos.y -= Math.cos(rad) * currentStrideMM; 

        markerPos.x = Math.max(0, Math.min(roomSize, markerPos.x));
        markerPos.y = Math.max(0, Math.min(roomSize, markerPos.y));
    }

    function simulateStep() {
        if (!isRunning) {
            alert('請先點擊上方按鈕啟動系統！');
            return;
        }
        addStepForward();
    }

    function waitMarker() {
        markerPos.x = userPos.x;
        markerPos.y = userPos.y;
    }

    function syncPositionAtMarker() {
        userPos.x = markerPos.x;
        userPos.y = markerPos.y;
    }

    function calibrateByDevice() {
        let code = document.getElementById('deviceInput').value.trim().toUpperCase();
        if (devices[code]) {
            userPos.x = devices[code].x;
            userPos.y = devices[code].y;
            markerPos.x = devices[code].x;
            markerPos.y = devices[code].y;
            displayPos.x = devices[code].x;
            displayPos.y = devices[code].y;
            cam.x = devices[code].x;
            cam.y = devices[code].y;
            alert(`成功校準至: ${devices[code].name}`);
            document.getElementById('deviceInput').value = '';
        } else {
            alert('無效的電掣編號！請輸入 SW-301 至 SW-304');
        }
    }

    let lastPeakTime = 0;
    window.addEventListener('devicemotion', (event) => {
        if (!isRunning) return;
        let acc = event.accelerationIncludingGravity;
        if (!acc) return;

        let totalAcc = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        let now = Date.now();

        let sensInput = parseInt(document.getElementById('sensitivityInput').value) || 60;
        sensInput = Math.max(1, Math.min(100, sensInput));
        let threshold = 13.5 - (sensInput / 100) * 3.5; 

        if (totalAcc > threshold && (now - lastPeakTime) > 300) {
            lastPeakTime = now;
            addStepForward();
        }
    }, true);

    animationLoop();
</script>

</body>
</html>
